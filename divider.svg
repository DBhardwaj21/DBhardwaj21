<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="15%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="85%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <style>
    @keyframes line-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    .pulse-line { animation: line-pulse 3s infinite ease-in-out; }
  </style>

  <g transform="translate(0, 12)">
    <line x1="40" y1="0" x2="860" y2="0" stroke="url(#divider-grad)" stroke-width="1.5" class="pulse-line"/>
    <polygon points="450,-5 455,0 450,5 445,0" fill="#22D3EE"/>
    <circle cx="450" cy="0" r="2" fill="#F8FAFC"/>
    <circle cx="150" cy="0" r="3" fill="#3B82F6" opacity="0.8"/>
    <circle cx="750" cy="0" r="3" fill="#8B5CF6" opacity="0.8"/>
  </g>
</svg>
