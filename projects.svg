<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    
    <pattern id="grid-projects" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1E293B"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap');

    .header-title { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 22px; fill: #F8FAFC; letter-spacing: 1.5px; }
    .card-title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; fill: #F8FAFC; }
    .card-desc { font-family: 'Inter', sans-serif; font-size: 12px; fill: #94A3B8; font-weight: 400; line-height: 1.5; }
    .tag-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #22D3EE; font-weight: 600; }
    .status-active { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #34D399; font-weight: 700; }
    .status-running { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #3B82F6; font-weight: 700; }
    .status-stable { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #A78BFA; font-weight: 700; }
    .status-prod { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #F59E0B; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="1"/>
  <rect width="900" height="480" rx="16" fill="url(#grid-projects)" opacity="0.6"/>

  <!-- Section Title Header -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" class="header-title">FEATURED_PROJECTS<tspan fill="#22D3EE">()</tspan></text>
    <line x1="0" y1="12" x2="820" y2="12" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- GRID 2x2 -->

  <!-- CARD 1: AI Code Review Agent -->
  <g transform="translate(40, 75)">
    <rect width="400" height="175" rx="12" fill="#111827" stroke="url(#card-border)" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <g transform="translate(20, 25)">
      <circle cx="10" cy="10" r="10" fill="#0284C7" opacity="0.2"/>
      <path d="M 6 10 L 9 13 L 14 7" stroke="#22D3EE" stroke-width="2" fill="none"/>
      <text x="30" y="14" class="card-title">AI Code Review Agent</text>
      
      <!-- Status Badge -->
      <rect x="270" y="0" width="90" height="20" rx="10" fill="#064E3B"/>
      <circle cx="282" cy="10" r="3" fill="#34D399"/>
      <text x="292" y="14" class="status-active">ACTIVE</text>
    </g>

    <!-- Description -->
    <text x="20" y="75" class="card-desc" width="360">Autonomous PR review system using LLMs &amp; GitHub Apps to perform static analysis, flag security bugs, &amp; suggest optimizations.</text>

    <!-- Tech Stack Badges -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#1E293B"/>
      <text x="10" y="15" class="tag-text">Python</text>

      <rect x="66" y="0" width="62" height="22" rx="4" fill="#1E293B"/>
      <text x="76" y="15" class="tag-text">FastAPI</text>

      <rect x="134" y="0" width="88" height="22" rx="4" fill="#1E293B"/>
      <text x="144" y="15" class="tag-text">GitHub Apps</text>

      <rect x="228" y="0" width="60" height="22" rx="4" fill="#1E293B"/>
      <text x="238" y="15" class="tag-text">OpenAI</text>
    </g>
  </g>

  <!-- CARD 2: Agentic RAG -->
  <g transform="translate(460, 75)">
    <rect width="400" height="175" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <g transform="translate(20, 25)">
      <circle cx="10" cy="10" r="10" fill="#1E3A8A" opacity="0.4"/>
      <circle cx="10" cy="10" r="4" fill="#3B82F6"/>
      <text x="30" y="14" class="card-title">Agentic RAG Engine</text>
      
      <!-- Status Badge -->
      <rect x="270" y="0" width="90" height="20" rx="10" fill="#1E3A8A"/>
      <circle cx="282" cy="10" r="3" fill="#3B82F6"/>
      <text x="292" y="14" class="status-running">RUNNING</text>
    </g>

    <!-- Description -->
    <text x="20" y="75" class="card-desc" width="360">Multi-agent Retrieval Augmented Generation workflow with vector search for deep semantic search across complex developer docs.</text>

    <!-- Tech Stack Badges -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#1E293B"/>
      <text x="10" y="15" class="tag-text">LangChain</text>

      <rect x="82" y="0" width="56" height="22" rx="4" fill="#1E293B"/>
      <text x="92" y="15" class="tag-text">Ollama</text>

      <rect x="144" y="0" width="56" height="22" rx="4" fill="#1E293B"/>
      <text x="154" y="15" class="tag-text">Docker</text>

      <rect x="206" y="0" width="74" height="22" rx="4" fill="#1E293B"/>
      <text x="216" y="15" class="tag-text">ChromaDB</text>
    </g>
  </g>

  <!-- CARD 3: FaceAuth -->
  <g transform="translate(40, 270)">
    <rect width="400" height="175" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <g transform="translate(20, 25)">
      <circle cx="10" cy="10" r="10" fill="#4C1D95" opacity="0.4"/>
      <circle cx="10" cy="10" r="4" fill="#8B5CF6"/>
      <text x="30" y="14" class="card-title">FaceAuth Recognition</text>
      
      <!-- Status Badge -->
      <rect x="270" y="0" width="90" height="20" rx="10" fill="#3B0764"/>
      <circle cx="282" cy="10" r="3" fill="#A78BFA"/>
      <text x="292" y="14" class="status-stable">STABLE</text>
    </g>

    <!-- Description -->
    <text x="20" y="75" class="card-desc" width="360">High-precision facial authentication pipeline leveraging DeepFace, FaceNet embeddings, and anti-spoofing verification.</text>

    <!-- Tech Stack Badges -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="72" height="22" rx="4" fill="#1E293B"/>
      <text x="10" y="15" class="tag-text">DeepFace</text>

      <rect x="78" y="0" width="64" height="22" rx="4" fill="#1E293B"/>
      <text x="88" y="15" class="tag-text">FaceNet</text>

      <rect x="148" y="0" width="60" height="22" rx="4" fill="#1E293B"/>
      <text x="158" y="15" class="tag-text">OpenCV</text>
    </g>
  </g>

  <!-- CARD 4: JobNest -->
  <g transform="translate(460, 270)">
    <rect width="400" height="175" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <g transform="translate(20, 25)">
      <circle cx="10" cy="10" r="10" fill="#78350F" opacity="0.4"/>
      <circle cx="10" cy="10" r="4" fill="#F59E0B"/>
      <text x="30" y="14" class="card-title">JobNest Platform</text>
      
      <!-- Status Badge -->
      <rect x="270" y="0" width="90" height="20" rx="10" fill="#78350F"/>
      <circle cx="282" cy="10" r="3" fill="#F59E0B"/>
      <text x="292" y="14" class="status-prod">PRODUCTION</text>
    </g>

    <!-- Description -->
    <text x="20" y="75" class="card-desc" width="360">Modern job aggregation platform with AI-driven candidate profile matching and automated application tracking analytics.</text>

    <!-- Tech Stack Badges -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="52" height="22" rx="4" fill="#1E293B"/>
      <text x="10" y="15" class="tag-text">React</text>

      <rect x="58" y="0" width="64" height="22" rx="4" fill="#1E293B"/>
      <text x="68" y="15" class="tag-text">Express</text>

      <rect x="128" y="0" width="70" height="22" rx="4" fill="#1E293B"/>
      <text x="138" y="15" class="tag-text">MongoDB</text>
    </g>
  </g>
</svg>
