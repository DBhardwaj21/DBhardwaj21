<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Primary Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 2"/>
      <circle cx="30" cy="30" r="1" fill="#334155"/>
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, "Liberation Mono", monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    .title { font-weight: 800; font-size: 34px; fill: #F8FAFC; letter-spacing: 2px; }
    .subtitle { font-weight: 700; font-size: 13px; fill: #22D3EE; letter-spacing: 2px; }
    .tagline { font-size: 13.5px; fill: #94A3B8; font-weight: 400; }
    .status-lbl { font-size: 10.5px; fill: #64748B; font-weight: 700; letter-spacing: 1px; }
    .badge-txt { font-size: 11px; fill: #CBD5E1; font-weight: 600; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .pulse-glow { animation: pulse 4s ease-in-out infinite; }
    .blink-cursor { animation: blink 1s infinite; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="290" rx="14" fill="url(#bg-dark)" stroke="#1E293B" stroke-width="1"/>
  <rect width="900" height="290" rx="14" fill="url(#grid)" opacity="0.7"/>

  <!-- Top Border Accent -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 886 0 C 893.73 0 900 6.27 900 14 L 900 4 L 0 4 Z" fill="url(#accent-grad)"/>

  <!-- Left Hero Content -->
  <g transform="translate(45, 42)">
    <!-- Subtitle Pill -->
    <g transform="translate(0, 0)">
      <rect width="135" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#22D3EE"/>
      <text x="24" y="16" class="font-mono subtitle">AI ENGINEER</text>
    </g>

    <!-- Title -->
    <text x="0" y="65" class="font-mono title">DEV<tspan fill="url(#accent-grad)">//</tspan>NEXUS</text>

    <!-- Tagline -->
    <text x="0" y="92" class="font-sans tagline">Building Intelligent Developer Tools using LLMs &amp; Agentic AI</text>

    <!-- Badges Row -->
    <g transform="translate(0, 120)">
      <!-- Python -->
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#1E293B" stroke="#334155"/>
      <circle cx="12" cy="12" r="3" fill="#38BDF8"/>
      <text x="22" y="16" class="font-mono badge-txt">Python</text>

      <!-- FastAPI -->
      <rect x="84" y="0" width="78" height="24" rx="6" fill="#1E293B" stroke="#334155"/>
      <circle cx="96" cy="12" r="3" fill="#34D399"/>
      <text x="106" y="16" class="font-mono badge-txt">FastAPI</text>

      <!-- PyTorch -->
      <rect x="170" y="0" width="82" height="24" rx="6" fill="#1E293B" stroke="#334155"/>
      <circle cx="182" cy="12" r="3" fill="#F87171"/>
      <text x="192" y="16" class="font-mono badge-txt">PyTorch</text>

      <!-- LangChain -->
      <rect x="260" y="0" width="92" height="24" rx="6" fill="#1E293B" stroke="#334155"/>
      <circle cx="272" cy="12" r="3" fill="#A78BFA"/>
      <text x="282" y="16" class="font-mono badge-txt">LangChain</text>
    </g>

    <!-- Status Subline -->
    <g transform="translate(0, 182)">
      <circle cx="5" cy="5" r="3.5" fill="#34D399"/>
      <text x="16" y="9" class="font-mono" font-size="11" fill="#94A3B8">STATUS: <tspan fill="#34D399" font-weight="700">ONLINE</tspan> | LOCATION: <tspan fill="#F8FAFC">INDIA</tspan></text>
    </g>
  </g>

  <!-- Right Side Panel -->
  <g transform="translate(540, 35)">
    <rect width="315" height="220" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="315" height="32" rx="10" fill="#1E293B" opacity="0.7"/>

    <!-- Window buttons -->
    <circle cx="18" cy="16" r="4.5" fill="#EF4444"/>
    <circle cx="32" cy="16" r="4.5" fill="#F59E0B"/>
    <circle cx="46" cy="16" r="4.5" fill="#10B981"/>
    <text x="65" y="20" class="font-mono" font-size="11" fill="#94A3B8" font-weight="600">SYSTEM_CONTROL.sh</text>

    <!-- Item 1 -->
    <g transform="translate(18, 48)">
      <text x="0" y="14" class="font-mono status-lbl">AI SYSTEMS</text>
      <rect x="145" y="2" width="135" height="16" rx="4" fill="#064E3B"/>
      <rect x="145" y="2" width="135" height="16" rx="4" fill="#10B981"/>
      <text x="152" y="14" class="font-mono" font-size="9.5" fill="#FFFFFF" font-weight="700">100% ONLINE</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(18, 86)">
      <text x="0" y="14" class="font-mono status-lbl">AGENTIC ENGINE</text>
      <rect x="145" y="2" width="135" height="16" rx="4" fill="#1E3A8A"/>
      <rect x="145" y="2" width="135" height="16" rx="4" fill="#3B82F6"/>
      <text x="152" y="14" class="font-mono" font-size="9.5" fill="#FFFFFF" font-weight="700">ACTIVE // RUNNING</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(18, 124)">
      <text x="0" y="14" class="font-mono status-lbl">API GATEWAY</text>
      <rect x="145" y="2" width="135" height="16" rx="4" fill="#581C87"/>
      <rect x="145" y="2" width="135" height="16" rx="4" fill="#8B5CF6"/>
      <text x="152" y="14" class="font-mono" font-size="9.5" fill="#FFFFFF" font-weight="700">FASTAPI DEPLOYED</text>
    </g>

    <!-- Command Box -->
    <g transform="translate(18, 165)">
      <rect width="279" height="34" rx="6" fill="#0B1120" stroke="#1E293B"/>
      <text x="12" y="21" class="font-mono" font-size="11" fill="#38BDF8">&gt; nexus.deploy()</text>
      <text x="145" y="21" class="font-mono" font-size="11" fill="#34D399">[SUCCESS]</text>
      <rect x="228" y="11" width="7" height="14" fill="#F8FAFC" class="blink-cursor"/>
    </g>
  </g>
</svg>
