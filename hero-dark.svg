<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-dark" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="2 2"/>
      <circle cx="30" cy="30" r="1" fill="#334155"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap');

    .title { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 38px; fill: #F8FAFC; letter-spacing: 2px; }
    .subtitle { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; fill: #22D3EE; letter-spacing: 3px; text-transform: uppercase; }
    .tagline { font-family: 'Inter', sans-serif; font-size: 14px; fill: #94A3B8; font-weight: 400; }
    .status-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #64748B; font-weight: 700; letter-spacing: 1px; }
    
    @keyframes pulse-cyan {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes circuit-run {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .pulse-bg { animation: pulse-cyan 6s infinite ease-in-out; transform-origin: center; }
    .circuit-line { stroke-dasharray: 10 150; stroke-dashoffset: 0; animation: circuit-run 4s linear infinite; }
    .node-float-1 { animation: float-node 4s ease-in-out infinite; }
    .cursor-blink { animation: blink 1s infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="900" height="320" rx="16" fill="url(#bg-grad-dark)"/>
  <rect width="900" height="320" rx="16" fill="url(#grid-dark)" opacity="0.8"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="120" fill="#8B5CF6" opacity="0.15" filter="url(#glow-purple)" class="pulse-bg"/>
  <circle cx="750" cy="240" r="140" fill="#0284C7" opacity="0.15" filter="url(#glow-cyan)" class="pulse-bg"/>

  <!-- Top Accent Border Line -->
  <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 884 0 C 892.837 0 900 7.163 900 16 L 900 4 L 0 4 Z" fill="url(#primary-glow)"/>

  <!-- Futuristic Circuit Decorative Paths -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 50 280 L 180 280 L 220 240 L 380 240" class="circuit-line"/>
    <path d="M 700 40 L 780 40 L 820 80 L 850 80" class="circuit-line"/>
    <circle cx="380" cy="240" r="3" fill="#38BDF8"/>
    <circle cx="850" cy="80" r="3" fill="#38BDF8"/>
  </g>

  <!-- Left Hero Content Block -->
  <g transform="translate(50, 48)">
    <g transform="translate(0, 0)">
      <rect width="140" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#22D3EE"/>
      <text x="26" y="17" class="subtitle">AI ENGINEER</text>
    </g>

    <text x="0" y="70" class="title">DEV<tspan fill="url(#primary-glow)">//</tspan>NEXUS</text>
    <text x="0" y="98" class="tagline">Building Intelligent Developer Tools using LLMs &amp; Agentic AI</text>

    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="82" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
      <circle cx="12" cy="12" r="3" fill="#38BDF8"/>
      <text x="22" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Python</text>

      <rect x="90" y="0" width="82" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
      <circle cx="102" cy="12" r="3" fill="#34D399"/>
      <text x="112" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">FastAPI</text>

      <rect x="180" y="0" width="86" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
      <circle cx="192" cy="12" r="3" fill="#F87171"/>
      <text x="202" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">PyTorch</text>

      <rect x="274" y="0" width="96" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
      <circle cx="286" cy="12" r="3" fill="#A78BFA"/>
      <text x="296" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">LangChain</text>
    </g>
  </g>

  <!-- Right Side: Status Panel -->
  <g transform="translate(560, 45)" class="node-float-1">
    <rect width="290" height="225" rx="12" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="290" height="34" rx="12" fill="#1E293B" opacity="0.6"/>

    <circle cx="20" cy="17" r="5" fill="#EF4444"/>
    <circle cx="36" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="17" r="5" fill="#10B981"/>
    <text x="75" y="21" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" font-weight="600">SYSTEM_CONTROL.sh</text>

    <g transform="translate(20, 52)">
      <text x="0" y="15" class="status-title">AI SYSTEMS</text>
      <rect x="130" y="4" width="120" height="14" rx="3" fill="#064E3B"/>
      <rect x="130" y="4" width="100" height="14" rx="3" fill="#10B981"/>
      <text x="134" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF" font-weight="700">100% ONLINE</text>
    </g>

    <g transform="translate(20, 92)">
      <text x="0" y="15" class="status-title">AGENTIC ENGINE</text>
      <rect x="130" y="4" width="120" height="14" rx="3" fill="#1E3A8A"/>
      <rect x="130" y="4" width="110" height="14" rx="3" fill="#3B82F6"/>
      <text x="134" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF" font-weight="700">ACTIVE // RUNNING</text>
    </g>

    <g transform="translate(20, 132)">
      <text x="0" y="15" class="status-title">API GATEWAY</text>
      <rect x="130" y="4" width="120" height="14" rx="3" fill="#581C87"/>
      <rect x="130" y="4" width="105" height="14" rx="3" fill="#8B5CF6"/>
      <text x="134" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFFFFF" font-weight="700">FASTAPI DEPLOYED</text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="250" height="32" rx="6" fill="#0B1120" stroke="#1E293B"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">&gt; nexus.deploy()</text>
      <text x="130" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">[SUCCESS]</text>
      <rect x="205" y="10" width="7" height="13" fill="#F8FAFC" class="cursor-blink"/>
    </g>
  </g>

  <!-- Bottom Edge Status Line -->
  <g transform="translate(50, 282)">
    <circle cx="6" cy="6" r="4" fill="#34D399"/>
    <text x="18" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">STATUS: <tspan fill="#34D399" font-weight="700">ALL SYSTEMS OPERATIONAL</tspan> | LOCATION: <tspan fill="#F8FAFC">INDIA</tspan></text>
  </g>
</svg>
