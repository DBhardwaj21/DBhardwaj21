<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="hud-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="avatar-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 2"/>
      <circle cx="24" cy="24" r="1" fill="#334155"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');

    .font-mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    .tag-top { font-size: 11px; fill: #00F0FF; font-weight: 700; letter-spacing: 1.5px; }
    .title-name { font-size: 32px; font-weight: 800; fill: #FFFFFF; letter-spacing: 1.5px; }
    .title-role { font-size: 14px; font-weight: 700; fill: #00F0FF; letter-spacing: 2px; }
    .tagline { font-size: 12.5px; font-weight: 600; fill: #CBD5E1; }
    .bio-text { font-size: 11px; fill: #94A3B8; line-height: 1.5; font-weight: 400; }

    .status-hdr { font-size: 10px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.5px; }
    .status-lbl { font-size: 9.5px; font-weight: 600; fill: #64748B; letter-spacing: 1px; }
    .status-val { font-size: 9.5px; font-weight: 700; fill: #34D399; letter-spacing: 1px; }

    .code-txt { font-size: 10.5px; fill: #E2E8F0; line-height: 1.55; }
    .term-txt { font-size: 10px; fill: #38BDF8; line-height: 1.6; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor-blink { animation: blink 1s infinite; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="380" rx="14" fill="url(#bg-dark)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="900" height="380" rx="14" fill="url(#grid)" opacity="0.65"/>

  <!-- Top Accent Bar -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 886 0 C 893.73 0 900 6.27 900 14 L 900 4 L 0 4 Z" fill="url(#cyan-grad)"/>

  <!-- ==================== LEFT SECTION: BIO & STATUS ==================== -->
  <g transform="translate(36, 30)">
    <!-- Tag: > DEV//OS -->
    <text x="0" y="10" class="font-mono tag-top">&gt; DEV//OS</text>

    <!-- Name: DEV BHARDWAJ -->
    <text x="0" y="42" class="font-sans title-name">DEV BHARDWAJ</text>

    <!-- Subtitle: AI ENGINEER -->
    <text x="0" y="65" class="font-mono title-role">AI ENGINEER</text>

    <!-- Sub-tagline -->
    <text x="0" y="88" class="font-sans tagline">Building Intelligent Developer Tools</text>

    <!-- Bio paragraph -->
    <text x="0" y="110" class="font-sans bio-text">I build AI-powered applications and developer tools that</text>
    <text x="0" y="126" class="font-sans bio-text">leverage LLMs, Agentic AI and modern backend systems</text>
    <text x="0" y="142" class="font-sans bio-text">to solve real-world problems.</text>

    <!-- Tech Badges Pill Row -->
    <g transform="translate(0, 160)">
      <!-- Python -->
      <rect x="0" y="0" width="68" height="22" rx="11" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="10" cy="11" r="3" fill="#38BDF8"/>
      <text x="18" y="15" class="font-mono" font-size="10" fill="#CBD5E1" font-weight="600">Python</text>

      <!-- FastAPI -->
      <rect x="74" y="0" width="70" height="22" rx="11" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="84" cy="11" r="3" fill="#34D399"/>
      <text x="92" y="15" class="font-mono" font-size="10" fill="#CBD5E1" font-weight="600">FastAPI</text>

      <!-- LangChain -->
      <rect x="150" y="0" width="82" height="22" rx="11" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="160" cy="11" r="3" fill="#A78BFA"/>
      <text x="168" y="15" class="font-mono" font-size="10" fill="#CBD5E1" font-weight="600">LangChain</text>

      <!-- GitHub Apps -->
      <rect x="238" y="0" width="92" height="22" rx="11" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="248" cy="11" r="3" fill="#00F0FF"/>
      <text x="256" y="15" class="font-mono" font-size="10" fill="#CBD5E1" font-weight="600">GitHub Apps</text>

      <!-- Docker -->
      <rect x="336" y="0" width="68" height="22" rx="11" fill="#0F172A" stroke="#1E293B"/>
      <circle cx="346" cy="11" r="3" fill="#60A5FA"/>
      <text x="354" y="15" class="font-mono" font-size="10" fill="#CBD5E1" font-weight="600">Docker</text>
    </g>

    <!-- SYSTEM STATUS Box -->
    <g transform="translate(0, 200)">
      <rect width="270" height="92" rx="8" fill="#080E1E" stroke="#1E293B" stroke-width="1.5"/>
      <rect width="270" height="92" rx="8" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.25"/>

      <!-- Header -->
      <text x="14" y="22" class="font-mono status-hdr">SYSTEM STATUS</text>
      <line x1="14" y1="28" x2="256" y2="28" stroke="#1E293B" stroke-width="1"/>

      <!-- Items -->
      <text x="14" y="45" class="font-mono status-lbl">AI SYSTEMS:</text>
      <text x="96" y="45" class="font-mono status-val">ONLINE</text>

      <text x="14" y="61" class="font-mono status-lbl">BUILDING:</text>
      <text x="96" y="61" class="font-mono status-val">EVERYDAY</text>

      <text x="14" y="77" class="font-mono status-lbl">FOCUS:</text>
      <text x="96" y="77" class="font-mono status-val" fill="#00F0FF">AI • AGENTS • AUTOMATION</text>
    </g>
  </g>

  <!-- ==================== CENTER SECTION: CYBER HUD AVATAR ==================== -->
  <g transform="translate(450, 190)">
    <circle cx="0" cy="0" r="130" fill="url(#avatar-aura)"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#hud-ring)" stroke-width="2.5" filter="url(#neon-glow)"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="30 10 5 10" opacity="0.6"/>
    <circle cx="0" cy="0" r="92" fill="#090F1F" stroke="#1E293B" stroke-width="2"/>

    <!-- Crosshairs -->
    <line x1="-120" y1="0" x2="-100" y2="0" stroke="#00F0FF" stroke-width="2"/>
    <line x1="100" y1="0" x2="120" y2="0" stroke="#00F0FF" stroke-width="2"/>
    <line x1="0" y1="-120" x2="0" y2="-100" stroke="#00F0FF" stroke-width="2"/>
    <line x1="0" y1="100" x2="0" y2="120" stroke="#00F0FF" stroke-width="2"/>

    <circle cx="-110" cy="0" r="3" fill="#00F0FF"/>
    <circle cx="110" cy="0" r="3" fill="#00F0FF"/>
    <circle cx="0" cy="-110" r="3" fill="#00F0FF"/>
    <circle cx="0" cy="110" r="3" fill="#00F0FF"/>

    <!-- Sci-Fi Developer Avatar -->
    <path d="M -40 20 C -40 -25 -28 -60 0 -60 C 28 -60 40 -25 40 20 C 38 42 28 60 0 60 C -28 60 -38 42 -40 20 Z" fill="#0C1427" stroke="#00F0FF" stroke-width="1.5"/>
    <path d="M -30 -35 C -38 -48 -18 -64 -4 -62 C 10 -64 30 -52 32 -35 C 22 -48 10 -54 0 -52 C -10 -54 -22 -46 -30 -35 Z" fill="#00F0FF" opacity="0.8"/>
    <circle cx="-18" cy="-48" r="9" fill="#1E293B"/>
    <circle cx="0" cy="-54" r="11" fill="#1E293B"/>
    <circle cx="18" cy="-48" r="9" fill="#1E293B"/>

    <!-- Glasses -->
    <rect x="-26" y="-12" width="20" height="13" rx="3" fill="#00F0FF" opacity="0.85" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="6" y="-12" width="20" height="13" rx="3" fill="#00F0FF" opacity="0.85" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#00F0FF" stroke-width="2"/>

    <!-- Hoodie -->
    <path d="M -65 80 C -60 46 -40 38 -22 36 L 0 48 L 22 36 C 40 38 60 46 65 80 Z" fill="#0F172A" stroke="#00F0FF" stroke-width="1.5"/>
  </g>

  <!-- ==================== RIGHT SECTION: TERMINAL & CODE.EXE ==================== -->
  <!-- TERMINAL -->
  <g transform="translate(595, 28)">
    <rect width="200" height="100" rx="8" fill="#080E1E" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="200" height="22" rx="8" fill="#0F172A"/>
    <line x1="0" y1="22" x2="200" y2="22" stroke="#1E293B" stroke-width="1"/>

    <circle cx="10" cy="11" r="3" fill="#EF4444"/>
    <circle cx="20" cy="11" r="3" fill="#F59E0B"/>
    <circle cx="30" cy="11" r="3" fill="#10B981"/>
    <text x="44" y="15" class="font-mono" font-size="9" fill="#94A3B8" font-weight="600">TERMINAL</text>

    <g transform="translate(10, 38)">
      <text x="0" y="0" class="font-mono term-txt">&gt; building the future</text>
      <text x="0" y="15" class="font-mono term-txt">&gt; deploying intelligence</text>
      <text x="0" y="30" class="font-mono term-txt">&gt; automating everything</text>
      <text x="0" y="45" class="font-mono term-txt">&gt; <tspan class="cursor-blink" fill="#00F0FF">_</tspan></text>
    </g>
  </g>

  <!-- CODE.EXE -->
  <g transform="translate(595, 142)">
    <rect width="235" height="205" rx="8" fill="#080E1E" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="235" height="22" rx="8" fill="#0F172A"/>
    <line x1="0" y1="22" x2="235" y2="22" stroke="#1E293B" stroke-width="1"/>

    <circle cx="10" cy="11" r="3" fill="#EF4444"/>
    <circle cx="20" cy="11" r="3" fill="#F59E0B"/>
    <circle cx="30" cy="11" r="3" fill="#10B981"/>
    <text x="44" y="15" class="font-mono" font-size="9" fill="#94A3B8" font-weight="600">CODE.EXE</text>

    <g transform="translate(12, 40)">
      <text x="0" y="0" class="font-mono code-txt"><tspan fill="#F43F5E">from</tspan> dev <tspan fill="#F43F5E">import</tspan> build</text>
      <text x="0" y="18" class="font-mono code-txt"><tspan fill="#F43F5E">class</tspan> <tspan fill="#F59E0B">Mission</tspan>:</text>
      <text x="0" y="34" class="font-mono code-txt">  <tspan fill="#F43F5E">def</tspan> <tspan fill="#60A5FA">__init__</tspan>(self):</text>
      <text x="0" y="50" class="font-mono code-txt">    self.goal = <tspan fill="#34D399">"Make developers"</tspan></text>
      <text x="0" y="66" class="font-mono code-txt">    <tspan fill="#34D399">"10x more productive"</tspan></text>

      <text x="0" y="90" class="font-mono code-txt">  <tspan fill="#F43F5E">def</tspan> <tspan fill="#60A5FA">execute</tspan>(self):</text>
      <text x="0" y="106" class="font-mono code-txt">    <tspan fill="#F43F5E">return</tspan> build(intelligence=<tspan fill="#A78BFA">True</tspan>)</text>

      <text x="0" y="130" class="font-mono code-txt">mission = Mission()</text>
      <text x="0" y="146" class="font-mono code-txt">mission.execute()</text>
    </g>
  </g>

  <!-- FLOATING ICONS (FAR RIGHT) -->
  <g transform="translate(845, 28)">
    <circle cx="15" cy="15" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="15" y="19" text-anchor="middle" font-size="12">🐍</text>

    <circle cx="15" cy="60" r="14" fill="#0F172A" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="15" y="64" text-anchor="middle" font-size="12">⚛️</text>

    <circle cx="15" cy="105" r="14" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
    <text x="15" y="109" text-anchor="middle" font-size="12">⚡</text>

    <circle cx="15" cy="150" r="14" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="15" y="154" text-anchor="middle" font-size="12">🦜</text>

    <circle cx="15" cy="195" r="14" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="15" y="199" text-anchor="middle" font-size="12">🐳</text>

    <circle cx="15" cy="240" r="14" fill="#0F172A" stroke="#F8FAFC" stroke-width="1.5"/>
    <text x="15" y="244" text-anchor="middle" font-size="12">🐙</text>
  </g>
</svg>
