<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyan-glow-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="2 2"/>
      <circle cx="24" cy="24" r="1" fill="#94A3B8"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');

    .font-mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    .tag-top { font-size: 11px; fill: #0284C7; font-weight: 700; letter-spacing: 1.5px; }
    .title-name { font-size: 34px; font-weight: 800; fill: #0F172A; letter-spacing: 1.5px; }
    .title-role { font-size: 15px; font-weight: 700; fill: #0284C7; letter-spacing: 2px; }
    .tagline { font-size: 13px; font-weight: 600; fill: #334155; }
    .bio-text { font-size: 11.5px; fill: #475569; line-height: 1.5; font-weight: 400; }

    .status-hdr { font-size: 10px; font-weight: 700; fill: #0284C7; letter-spacing: 1.5px; }
    .status-lbl { font-size: 9.5px; font-weight: 600; fill: #64748B; letter-spacing: 1px; }
    .status-val { font-size: 9.5px; font-weight: 700; fill: #059669; letter-spacing: 1px; }

    .code-txt { font-size: 11px; fill: #1E293B; line-height: 1.55; }
    .term-txt { font-size: 10.5px; fill: #0284C7; line-height: 1.6; }
  </style>

  <!-- Container Box -->
  <rect width="960" height="390" rx="14" fill="url(#bg-light)" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect width="960" height="390" rx="14" fill="url(#grid-light)" opacity="0.65"/>

  <!-- Top Accent Bar -->
  <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 946 0 C 953.73 0 960 6.27 960 14 L 960 4 L 0 4 Z" fill="url(#cyan-glow-light)"/>

  <!-- LEFT SECTION -->
  <g transform="translate(38, 32)">
    <text x="0" y="10" class="font-mono tag-top">&gt; DEV//OS</text>
    <text x="0" y="44" class="font-sans title-name">DEV BHARDWAJ</text>
    <text x="0" y="68" class="font-mono title-role">AI ENGINEER</text>
    <text x="0" y="94" class="font-sans tagline">Building Intelligent Developer Tools</text>

    <text x="0" y="116" class="font-sans bio-text">I build AI-powered applications and developer tools that</text>
    <text x="0" y="132" class="font-sans bio-text">leverage LLMs, Agentic AI and modern backend systems</text>
    <text x="0" y="148" class="font-sans bio-text">to solve real-world problems.</text>

    <!-- Badges Row -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="70" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="10" cy="11" r="3" fill="#0284C7"/>
      <text x="18" y="15" class="font-mono" font-size="10" fill="#334155" font-weight="600">Python</text>

      <rect x="76" y="0" width="72" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="86" cy="11" r="3" fill="#059669"/>
      <text x="94" y="15" class="font-mono" font-size="10" fill="#334155" font-weight="600">FastAPI</text>

      <rect x="154" y="0" width="84" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="164" cy="11" r="3" fill="#7C3AED"/>
      <text x="172" y="15" class="font-mono" font-size="10" fill="#334155" font-weight="600">LangChain</text>

      <rect x="244" y="0" width="94" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="254" cy="11" r="3" fill="#0284C7"/>
      <text x="262" y="15" class="font-mono" font-size="10" fill="#334155" font-weight="600">GitHub Apps</text>

      <rect x="344" y="0" width="72" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
      <circle cx="354" cy="11" r="3" fill="#2563EB"/>
      <text x="362" y="15" class="font-mono" font-size="10" fill="#334155" font-weight="600">Docker</text>
    </g>

    <!-- STATUS Box -->
    <g transform="translate(0, 208)">
      <rect width="280" height="95" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

      <text x="14" y="22" class="font-mono status-hdr">SYSTEM STATUS</text>
      <line x1="14" y1="28" x2="266" y2="28" stroke="#E2E8F0" stroke-width="1"/>

      <text x="14" y="46" class="font-mono status-lbl">AI SYSTEMS:</text>
      <text x="100" y="46" class="font-mono status-val">ONLINE</text>

      <text x="14" y="62" class="font-mono status-lbl">BUILDING:</text>
      <text x="100" y="62" class="font-mono status-val">EVERYDAY</text>

      <text x="14" y="78" class="font-mono status-lbl">FOCUS:</text>
      <text x="100" y="78" class="font-mono status-val" fill="#0284C7">AI • AGENTS • AUTOMATION</text>
    </g>
  </g>

  <!-- CENTER HUD AVATAR -->
  <g transform="translate(485, 195)">
    <circle cx="0" cy="0" r="116" fill="none" stroke="url(#cyan-glow-light)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="106" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="30 10 5 10"/>
    <circle cx="0" cy="0" r="98" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Avatar Silhouette -->
    <path d="M -42 22 C -42 -25 -30 -62 0 -62 C 30 -62 42 -25 42 22 C 40 45 30 65 0 65 C -30 65 -40 45 -42 22 Z" fill="#F1F5F9" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="-20" cy="-52" r="10" fill="#CBD5E1"/>
    <circle cx="0" cy="-58" r="12" fill="#CBD5E1"/>
    <circle cx="20" cy="-52" r="10" fill="#CBD5E1"/>

    <!-- Glasses -->
    <rect x="-28" y="-14" width="22" height="14" rx="3" fill="#0284C7" opacity="0.85" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="6" y="-14" width="22" height="14" rx="3" fill="#0284C7" opacity="0.85" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="-6" y1="-7" x2="6" y2="-7" stroke="#0284C7" stroke-width="2"/>

    <!-- Hoodie -->
    <path d="M -70 85 C -65 50 -45 42 -25 40 L 0 52 L 25 40 C 45 42 65 50 70 85 Z" fill="#E2E8F0" stroke="#0284C7" stroke-width="1.5"/>
  </g>

  <!-- RIGHT SECTION -->
  <!-- TERMINAL WINDOW -->
  <g transform="translate(635, 30)">
    <rect width="215" height="105" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="215" height="24" rx="8" fill="#F1F5F9"/>
    <line x1="0" y1="24" x2="215" y2="24" stroke="#CBD5E1" stroke-width="1"/>

    <circle cx="12" cy="12" r="3.5" fill="#EF4444"/>
    <circle cx="23" cy="12" r="3.5" fill="#F59E0B"/>
    <circle cx="34" cy="12" r="3.5" fill="#10B981"/>

    <text x="50" y="16" class="font-mono" font-size="9.5" fill="#475569" font-weight="600">TERMINAL</text>

    <g transform="translate(12, 42)">
      <text x="0" y="0" class="font-mono term-txt">&gt; building the future</text>
      <text x="0" y="16" class="font-mono term-txt">&gt; deploying intelligence</text>
      <text x="0" y="32" class="font-mono term-txt">&gt; automating everything</text>
      <text x="0" y="48" class="font-mono term-txt">&gt; <tspan fill="#0284C7">_</tspan></text>
    </g>
  </g>

  <!-- CODE.EXE WINDOW -->
  <g transform="translate(635, 148)">
    <rect width="250" height="210" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect width="250" height="24" rx="8" fill="#F1F5F9"/>
    <line x1="0" y1="24" x2="250" y2="24" stroke="#CBD5E1" stroke-width="1"/>

    <circle cx="12" cy="12" r="3.5" fill="#EF4444"/>
    <circle cx="23" cy="12" r="3.5" fill="#F59E0B"/>
    <circle cx="34" cy="12" r="3.5" fill="#10B981"/>

    <text x="50" y="16" class="font-mono" font-size="9.5" fill="#475569" font-weight="600">CODE.EXE</text>

    <g transform="translate(14, 44)">
      <text x="0" y="0" class="font-mono code-txt"><tspan fill="#D97706">from</tspan> dev <tspan fill="#D97706">import</tspan> build</text>
      <text x="0" y="20" class="font-mono code-txt"><tspan fill="#D97706">class</tspan> <tspan fill="#2563EB">Mission</tspan>:</text>
      <text x="0" y="36" class="font-mono code-txt">  <tspan fill="#D97706">def</tspan> <tspan fill="#0284C7">__init__</tspan>(self):</text>
      <text x="0" y="52" class="font-mono code-txt">    self.goal = <tspan fill="#059669">"Make developers"</tspan></text>
      <text x="0" y="68" class="font-mono code-txt">    <tspan fill="#059669">"10x more productive"</tspan></text>

      <text x="0" y="92" class="font-mono code-txt">  <tspan fill="#D97706">def</tspan> <tspan fill="#0284C7">execute</tspan>(self):</text>
      <text x="0" y="108" class="font-mono code-txt">    <tspan fill="#D97706">return</tspan> build(intelligence=<tspan fill="#7C3AED">True</tspan>)</text>

      <text x="0" y="132" class="font-mono code-txt">mission = Mission()</text>
      <text x="0" y="148" class="font-mono code-txt">mission.execute()</text>
    </g>
  </g>

  <!-- FLOATING ICONS -->
  <g transform="translate(900, 30)">
    <circle cx="16" cy="16" r="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="16" cy="64" r="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="16" cy="112" r="15" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <circle cx="16" cy="160" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="16" cy="208" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="16" cy="256" r="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  </g>
</svg>
