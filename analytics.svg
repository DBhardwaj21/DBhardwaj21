<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-analytics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <pattern id="grid-analytics" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap');

    .font-mono { font-family: 'Fira Code', monospace; }
    .font-sans { font-family: 'Inter', sans-serif; }

    .hdr-title { font-size: 15px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.5px; }
    .card-lbl { font-size: 11px; fill: #94A3B8; font-weight: 600; }
    .num-big { font-size: 26px; fill: #F8FAFC; font-weight: 800; }
    .stat-lbl { font-size: 11.5px; fill: #94A3B8; font-weight: 500; }
    .stat-val { font-size: 12px; fill: #F8FAFC; font-weight: 700; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="380" rx="14" fill="url(#bg-analytics)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="900" height="380" rx="14" fill="url(#grid-analytics)" opacity="0.5"/>

  <!-- Header -->
  <g transform="translate(36, 28)">
    <rect width="210" height="30" rx="6" fill="#080E1E" stroke="#1E293B" stroke-width="1.5"/>
    <text x="14" y="20" class="font-mono hdr-title">📊 GITHUB_ANALYTICS</text>
  </g>

  <!-- ==================== LEFT SIDE: STREAKS & STATS ==================== -->

  <!-- Streak Card -->
  <g transform="translate(36, 72)">
    <rect width="404" height="75" rx="8" fill="#0D1424" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Flame Icon -->
    <text x="20" y="46" font-size="28">🔥</text>

    <!-- Current Streak -->
    <g transform="translate(65, 24)">
      <text x="0" y="12" class="font-sans card-lbl">Current Streak</text>
      <text x="0" y="40" class="font-sans num-big">86 <tspan font-size="12" fill="#94A3B8" font-weight="500">days</tspan></text>
    </g>

    <!-- Divider Line -->
    <line x1="220" y1="15" x2="220" y2="60" stroke="#1E293B" stroke-width="1"/>

    <!-- Longest Streak -->
    <g transform="translate(245, 24)">
      <text x="0" y="12" class="font-sans card-lbl">Longest Streak</text>
      <text x="0" y="40" class="font-sans num-big">146 <tspan font-size="12" fill="#94A3B8" font-weight="500">days</tspan></text>
    </g>
  </g>

  <!-- GitHub Stats Table Card -->
  <g transform="translate(36, 160)">
    <rect width="190" height="110" rx="8" fill="#0D1424" stroke="#1E293B" stroke-width="1.5"/>
    <text x="16" y="24" class="font-mono" font-size="11" fill="#00F0FF" font-weight="700">🐱 GitHub Stats</text>

    <text x="16" y="46" class="font-sans stat-lbl">Total Stars</text>
    <text x="174" y="46" text-anchor="end" class="font-mono stat-val">62</text>

    <text x="16" y="66" class="font-sans stat-lbl">Total Commits</text>
    <text x="174" y="66" text-anchor="end" class="font-mono stat-val">1.2K</text>

    <text x="16" y="86" class="font-sans stat-lbl">Total PRs</text>
    <text x="174" y="86" text-anchor="end" class="font-mono stat-val">48</text>

    <text x="16" y="104" class="font-sans stat-lbl">Repositories</text>
    <text x="174" y="104" text-anchor="end" class="font-mono stat-val">28</text>
  </g>

  <!-- Top Languages Donut Chart Card -->
  <g transform="translate(240, 160)">
    <rect width="200" height="110" rx="8" fill="#0D1424" stroke="#1E293B" stroke-width="1.5"/>
    <text x="16" y="24" class="font-mono" font-size="11" fill="#00F0FF" font-weight="700">🍰 Top Languages</text>

    <!-- Donut SVG Graphic -->
    <g transform="translate(50, 68)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#1E293B" stroke-width="12"/>
      <!-- Python segment 69.1% -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#38BDF8" stroke-width="12" stroke-dasharray="130 188" transform="rotate(-90)"/>
      <!-- JS segment 14.3% -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#F59E0B" stroke-width="12" stroke-dasharray="27 188" transform="rotate(159)"/>
      <!-- TS segment 7.8% -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#3178C6" stroke-width="12" stroke-dasharray="15 188" transform="rotate(210)"/>
      <!-- Other segment 8.8% -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#A78BFA" stroke-width="12" stroke-dasharray="16 188" transform="rotate(240)"/>
    </g>

    <!-- Legend -->
    <g transform="translate(100, 42)">
      <circle cx="6" cy="6" r="4" fill="#38BDF8"/>
      <text x="15" y="9" class="font-sans" font-size="10" fill="#CBD5E1">Python 69.1%</text>

      <circle cx="6" cy="22" r="4" fill="#F59E0B"/>
      <text x="15" y="25" class="font-sans" font-size="10" fill="#CBD5E1">JavaScript 14.3%</text>

      <circle cx="6" cy="38" r="4" fill="#3178C6"/>
      <text x="15" y="41" class="font-sans" font-size="10" fill="#CBD5E1">TypeScript 7.8%</text>

      <circle cx="6" cy="54" r="4" fill="#A78BFA"/>
      <text x="15" y="57" class="font-sans" font-size="10" fill="#CBD5E1">Other 8.8%</text>
    </g>
  </g>

