<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
    
    .footer-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94A3B8; }
    .status-online { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #34D399; font-weight: 700; }
    
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .dot-pulse { animation: pulse-dot 2s infinite ease-in-out; transform-origin: center; }
  </style>

  <rect width="900" height="60" rx="8" fill="url(#footer-bg)" stroke="#1E293B" stroke-width="1"/>
  
  <g transform="translate(30, 34)">
    <circle cx="0" cy="-4" r="4" fill="#34D399" class="dot-pulse"/>
    <text x="14" y="0" class="footer-text">SYSTEM STATUS: <tspan class="status-online">ONLINE</tspan></text>
  </g>

  <g transform="translate(450, 34)">
    <text x="0" y="0" text-anchor="middle" class="footer-text">DEV//NEXUS <tspan fill="#38BDF8">v1.0</tspan> — Built with ❤️ + Coffee + AI</text>
  </g>

  <g transform="translate(870, 34)">
    <text x="0" y="0" text-anchor="end" class="footer-text">AUTO-UPDATED VIA <tspan fill="#A78BFA">GITHUB ACTIONS</tspan></text>
  </g>
</svg>
